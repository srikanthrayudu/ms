apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rideshare.fullname" . }}-config
  labels:
    {{- include "rideshare.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.global.logLevel | quote }}
  NATS_URL: "nats://{{ include "rideshare.fullname" . }}-nats:4222"
  LOCATION_SERVICE_ADDR: "{{ include "rideshare.fullname" . }}-location-service:50053"
  DRIVER_SERVICE_ADDR: "{{ include "rideshare.fullname" . }}-driver-service:50052"
  USER_SERVICE_ADDR: "{{ include "rideshare.fullname" . }}-user-service:50051"
  RIDE_SERVICE_ADDR: "{{ include "rideshare.fullname" . }}-ride-service:50054"
  PAYMENT_SERVICE_ADDR: "{{ include "rideshare.fullname" . }}-payment-service:50055"
  NOTIFICATION_SERVICE_ADDR: "{{ include "rideshare.fullname" . }}-notification-service:50056"
