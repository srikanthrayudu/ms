apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rideshare.fullname" . }}-nats
  labels:
    {{- include "rideshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  replicas: {{ .Values.nats.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rideshare.fullname" . }}-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rideshare.fullname" . }}-nats
    spec:
      containers:
        - name: nats
          image: "{{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}"
          args: ["-p", "4222", "-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          livenessProbe:
            httpGet:
              path: /varz
              port: 8222
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /varz
              port: 8222
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rideshare.fullname" . }}-nats
  labels:
    {{- include "rideshare.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "rideshare.fullname" . }}-nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
