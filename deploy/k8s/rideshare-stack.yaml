apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: rideshare
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: api-gateway
          image: rideshare/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: USER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: USER_SERVICE_ADDR
            - name: DRIVER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: DRIVER_SERVICE_ADDR
            - name: LOCATION_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: LOCATION_SERVICE_ADDR
            - name: RIDE_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: RIDE_SERVICE_ADDR
            - name: PAYMENT_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: PAYMENT_SERVICE_ADDR
            - name: NOTIFICATION_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: NOTIFICATION_SERVICE_ADDR
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: NATS_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: LOG_LEVEL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rideshare-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: rideshare
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rideshare-ingress
  namespace: rideshare
  labels:
    app.kubernetes.io/name: rideshare-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rideshare
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'nats'
        static_configs:
          - targets: ['nats:8222']
        metrics_path: /metrics
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway:8080']
        metrics_path: /metrics
      - job_name: 'user-service'
        static_configs:
          - targets: ['user-service:9090']
        metrics_path: /metrics
      - job_name: 'driver-service'
        static_configs:
          - targets: ['driver-service:9091']
        metrics_path: /metrics
      - job_name: 'location-service'
        static_configs:
          - targets: ['location-service:9092']
        metrics_path: /metrics
      - job_name: 'ride-service'
        static_configs:
          - targets: ['ride-service:9093']
        metrics_path: /metrics
      - job_name: 'payment-service'
        static_configs:
          - targets: ['payment-service:9094']
        metrics_path: /metrics
      - job_name: 'notification-service'
        static_configs:
          - targets: ['notification-service:9095']
        metrics_path: /metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: rideshare
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: rideshare
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
---
