apiVersion: v1
kind: Namespace
metadata:
  name: rideshare
  labels:
    app.kubernetes.io/name: rideshare
    app.kubernetes.io/part-of: rideshare-platform
apiVersion: v1
kind: ConfigMap
metadata:
  name: rideshare-config
  namespace: rideshare
data:
  LOG_LEVEL: "info"
  NATS_URL: "nats://nats:4222"
  LOCATION_SERVICE_ADDR: "location-service:50053"
  DRIVER_SERVICE_ADDR: "driver-service:50052"
  USER_SERVICE_ADDR: "user-service:50051"
  RIDE_SERVICE_ADDR: "ride-service:50054"
  PAYMENT_SERVICE_ADDR: "payment-service:50055"
  NOTIFICATION_SERVICE_ADDR: "notification-service:50056"
apiVersion: v1
kind: Secret
metadata:
  name: rideshare-secrets
  namespace: rideshare
type: Opaque
stringData:
  # In production, replace with a securely generated secret key (>= 16 characters)
  JWT_SECRET: "rideshare-production-super-secret-key-32chars!"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: rideshare
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args: ["-p", "4222", "-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          livenessProbe:
            httpGet:
              path: /varz
              port: 8222
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /varz
              port: 8222
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: rideshare
  labels:
    app.kubernetes.io/name: nats
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: rideshare
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: user-service
          image: rideshare/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: GRPC_ADDR
              value: ":50051"
            - name: DB_PATH
              value: "/app/data/user-service.db"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: LOG_LEVEL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rideshare-secrets
                  key: JWT_SECRET
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: rideshare
  labels:
    app.kubernetes.io/name: user-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
