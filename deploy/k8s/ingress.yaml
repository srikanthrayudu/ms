apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rideshare-ingress
  namespace: rideshare
  labels:
    app.kubernetes.io/name: rideshare-ingress
  annotations:
    # NGINX ingress support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Contour (Envoy) ingress support for Server-Sent Events (SSE) streaming
    projectcontour.io/response-timeout: "infinity"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
