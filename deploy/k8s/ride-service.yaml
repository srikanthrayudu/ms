apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-service
  namespace: rideshare
  labels:
    app.kubernetes.io/name: ride-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ride-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ride-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: ride-service
          image: rideshare/ride-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50054
          env:
            - name: GRPC_ADDR
              value: ":50054"
            - name: DB_PATH
              value: "/app/data/ride-service.db"
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: NATS_URL
            - name: LOCATION_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: LOCATION_SERVICE_ADDR
            - name: DRIVER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: DRIVER_SERVICE_ADDR
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: rideshare-config
                  key: LOG_LEVEL
            - name: WASM_FARE_ENGINE_PATH
              value: "/app/wasm/fare-engine.wasm"
          livenessProbe:
            grpc:
              port: 50054
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 50054
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: fare-engine-wasm
              mountPath: /app/wasm
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: fare-engine-wasm
          configMap:
            name: fare-engine-wasm
            optional: true   # pod starts even if ConfigMap absent; uses embedded .wasm
---
apiVersion: v1
kind: Service
metadata:
  name: ride-service
  namespace: rideshare
  labels:
    app.kubernetes.io/name: ride-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ride-service
  ports:
    - name: grpc
      port: 50054
      targetPort: 50054
