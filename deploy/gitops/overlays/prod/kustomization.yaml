apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rideshare-prod

resources:
  - ../../../k8s

patches:
  - target:
      kind: ConfigMap
      name: rideshare-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: ride-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
