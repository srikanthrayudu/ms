syntax = "proto3";

package user.v1;

option go_package = "ms/proto/gen/user/v1;userv1";

// UserService manages user accounts (passengers and drivers) and authentication.
service UserService {
  // Register creates a new user account and returns its id.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Login validates credentials and returns a signed JWT.
  rpc Login(LoginRequest) returns (LoginResponse);
  // GetProfile returns a user's public profile.
  rpc GetProfile(GetProfileRequest) returns (UserProfile);
  // UpdateProfile updates mutable profile fields.
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfile);
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  PASSENGER = 1;
  DRIVER = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string phone = 4;
  UserRole role = 5;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string user_id = 2;
  UserRole role = 3;
  int64 expires_at = 4; // unix seconds
}

message GetProfileRequest {
  string user_id = 1;
}

message UserProfile {
  string id = 1;
  string email = 2;
  string name = 3;
  string phone = 4;
  UserRole role = 5;
  int64 created_at = 6; // unix seconds
}

message UpdateProfileRequest {
  string user_id = 1;
  string name = 2;
  string phone = 3;
}
