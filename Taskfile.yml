version: '3'

vars:
  GOPATH:
    sh: go env GOPATH
  BINDIR: "{{.ROOT_DIR}}/bin"
  LOGDIR: /tmp/ms
  KIND_CLUSTER:
    sh: kind get clusters 2>/dev/null | grep -v '^$' | head -n 1 || echo "kind-cluster"
  CONTAINER_TOOL:
    sh: which docker 2>/dev/null || which podman 2>/dev/null || echo docker
  COMPOSE_CMD:
    sh: |
      if which docker-compose >/dev/null 2>&1; then echo "docker-compose";
      elif docker compose version >/dev/null 2>&1; then echo "docker compose";
      elif which podman-compose >/dev/null 2>&1; then echo "podman-compose";
      elif podman compose version >/dev/null 2>&1; then echo "podman compose";
      else echo "docker compose"; fi

tasks:

  # ─────────────────────────────────────────────
  # Default
  # ─────────────────────────────────────────────
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ─────────────────────────────────────────────
  # Proto
  # ─────────────────────────────────────────────
  proto:generate:
    desc: Regenerate Go gRPC code from protobuf definitions
    dir: "{{.ROOT_DIR}}/proto"
    cmds:
      - "{{.GOPATH}}/bin/buf generate"

  proto:lint:
    desc: Lint protobuf definitions with buf
    dir: "{{.ROOT_DIR}}/proto"
    cmds:
      - "{{.GOPATH}}/bin/buf lint"

  # ─────────────────────────────────────────────
  # Dependencies / Workspace
  # ─────────────────────────────────────────────
  tidy:
    desc: go work sync + go mod tidy for every module
    cmds:
      - go work sync
      - for:
          - proto
          - shared
          - services/user-service
          - services/driver-service
          - services/location-service
          - services/ride-service
          - services/payment-service
          - services/notification-service
          - services/api-gateway
          - services/simulator
        cmd: cd {{.ROOT_DIR}}/{{.ITEM}} && go mod tidy

  # ─────────────────────────────────────────────
  # Build
  # ─────────────────────────────────────────────
  build:
    desc: Build all service binaries into ./bin
    cmds:
      - mkdir -p "{{.BINDIR}}"
      - cd "{{.ROOT_DIR}}/services/user-service"         && go build -o "{{.BINDIR}}/user-service"         ./cmd/user-service
      - cd "{{.ROOT_DIR}}/services/driver-service"       && go build -o "{{.BINDIR}}/driver-service"       ./cmd/driver-service
      - cd "{{.ROOT_DIR}}/services/location-service"     && go build -o "{{.BINDIR}}/location-service"     ./cmd/location-service
      - cd "{{.ROOT_DIR}}/services/ride-service"         && go build -o "{{.BINDIR}}/ride-service"         ./cmd/ride-service
      - cd "{{.ROOT_DIR}}/services/payment-service"      && go build -o "{{.BINDIR}}/payment-service"      ./cmd/payment-service
      - cd "{{.ROOT_DIR}}/services/notification-service" && go build -o "{{.BINDIR}}/notification-service" ./cmd/notification-service
      - cd "{{.ROOT_DIR}}/services/api-gateway"          && go build -o "{{.BINDIR}}/api-gateway"          ./cmd/api-gateway

  build:service:
    desc: "Build a single service  (e.g. task build:service -- ride-service)"
    cmds:
      - cd "{{.ROOT_DIR}}/services/{{.CLI_ARGS}}" && go build -o "{{.BINDIR}}/{{.CLI_ARGS}}" ./cmd/{{.CLI_ARGS}}

  # ─────────────────────────────────────────────/
  # Run / Stop  (each service started via shell & so no background: property is needed)
  # ─────────────────────────────────────────────
  nats:
    desc: Run NATS server in the foreground (useful standalone)
    cmds:
      - "{{.GOPATH}}/bin/nats-server -p 4222 -m 8222"

  up:
    desc: Build everything then start NATS + all services in the background
    deps: [build]
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/data" "{{.LOGDIR}}"
      - |
        # Kill any stale instances first (ignore errors)
        pkill -f "{{.BINDIR}}/" 2>/dev/null || true
        pkill -f "nats-server -p 4222" 2>/dev/null || true
        sleep 0.5

        # Start NATS
        {{.GOPATH}}/bin/nats-server -p 4222 -m 8222 >"{{.LOGDIR}}/nats.log" 2>&1 &
        sleep 1

        # Start backend services (LOG_LEVEL=debug allows the default JWT_SECRET in dev)
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/user-service         >"{{.LOGDIR}}/user.log"         2>&1 &
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/driver-service       >"{{.LOGDIR}}/driver.log"       2>&1 &
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/location-service     >"{{.LOGDIR}}/location.log"     2>&1 &
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/ride-service         >"{{.LOGDIR}}/ride.log"         2>&1 &
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/payment-service      >"{{.LOGDIR}}/payment.log"      2>&1 &
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/notification-service >"{{.LOGDIR}}/notification.log" 2>&1 &
        sleep 1

        # Start gateway last (depends on all others)
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/api-gateway >"{{.LOGDIR}}/gateway.log" 2>&1 &
        sleep 1

        echo ""
        echo "  ✅  All services started"
        echo "  🌐  Gateway  → http://localhost:8080"
        echo "  📊  NATS mon → http://localhost:8222"
        echo "  📄  Logs     → {{.LOGDIR}}/*.log"
        echo ""

  down:
    desc: Stop all services and NATS
    cmds:
      - |
        for svc in api-gateway notification-service payment-service ride-service location-service driver-service user-service; do
          pkill -f "bin/$svc" 2>/dev/null && echo "  stopped $svc" || true
        done
        pkill -f "nats-server -p 4222" 2>/dev/null && echo "  stopped nats-server" || true
        echo "  ✅  All services stopped"

  restart:
    desc: "Restart a single service (e.g. task restart -- ride-service)"
    cmds:
      - pkill -f "bin/{{.CLI_ARGS}}" 2>/dev/null || true
      - sleep 0.3
      - cd "{{.ROOT_DIR}}" && ./bin/{{.CLI_ARGS}} >"{{.LOGDIR}}/{{.CLI_ARGS}}.log" 2>&1 &
      - echo "  ♻️  Restarted {{.CLI_ARGS}}"

  # ─────────────────────────────────────────────
  # Logs
  # ─────────────────────────────────────────────
  logs:
    desc: Tail all service logs
    cmds:
      - tail -f "{{.LOGDIR}}/nats.log" "{{.LOGDIR}}/user.log" "{{.LOGDIR}}/driver.log" "{{.LOGDIR}}/location.log" "{{.LOGDIR}}/ride.log" "{{.LOGDIR}}/payment.log" "{{.LOGDIR}}/notification.log" "{{.LOGDIR}}/gateway.log"

  logs:service:
    desc: "Tail a single service log (e.g. task logs:service -- ride)"
    cmds:
      - tail -f "{{.LOGDIR}}/{{.CLI_ARGS}}.log"

  # ─────────────────────────────────────────────
  # Test & Quality
  # ─────────────────────────────────────────────
  test:
    desc: Run all tests across the entire workspace
    cmds:
      - go test ./shared/... ./services/user-service/... ./services/driver-service/... ./services/location-service/... ./services/ride-service/... ./services/payment-service/... ./services/notification-service/... ./services/api-gateway/...

  vet:
    desc: Run go vet across all modules
    cmds:
      - for:
          - shared
          - services/user-service
          - services/driver-service
          - services/location-service
          - services/ride-service
          - services/payment-service
          - services/notification-service
          - services/api-gateway
          - services/simulator
        cmd: cd {{.ROOT_DIR}}/{{.ITEM}} && go vet ./... && echo "  ✅  {{.ITEM}}"

  # ─────────────────────────────────────────────
  # Clean
  # ─────────────────────────────────────────────
  clean:
    desc: Remove build artefacts and local databases
    cmds:
      - rm -rf "{{.BINDIR}}" "{{.ROOT_DIR}}/data"
      - echo "  🗑️   Cleaned bin/ and data/"

  clean:logs:
    desc: Remove all log files from /tmp/ms/
    cmds:
      - rm -f "{{.LOGDIR}}"/*.log
      - echo "  🗑️   Cleaned {{.LOGDIR}}/*.log"

  # ─────────────────────────────────────────────
  # DevOps & Containers
  # ─────────────────────────────────────────────
  docker:build:
    desc: Build all container images using Docker or Podman
    cmds:
      - for:
          - user-service
          - driver-service
          - location-service
          - ride-service
          - payment-service
          - notification-service
          - api-gateway
        cmd: "{{.CONTAINER_TOOL}} build -t rideshare/{{.ITEM}}:latest -t docker.io/rideshare/{{.ITEM}}:latest -f services/{{.ITEM}}/Dockerfile {{.ROOT_DIR}}"

  docker:build:service:
    desc: "Build a single container image (e.g. task docker:build:service -- ride-service)"
    cmds:
      - "{{.CONTAINER_TOOL}} build -t rideshare/{{.CLI_ARGS}}:latest -t docker.io/rideshare/{{.CLI_ARGS}}:latest -f services/{{.CLI_ARGS}}/Dockerfile {{.ROOT_DIR}}"

  compose:up:
    desc: Start the entire platform using Docker Compose or Podman Compose
    cmds:
      - "{{.COMPOSE_CMD}} up -d"
      - echo "  🚀 Compose stack started. Gateway at http://localhost:8080"

  compose:down:
    desc: Stop and remove the compose containers
    cmds:
      - "{{.COMPOSE_CMD}} down"
      - echo "  🛑 Compose stack stopped"

  compose:logs:
    desc: Tail compose logs across all services
    cmds:
      - "{{.COMPOSE_CMD}} logs -f"

  compose:obs:up:
    desc: Start the platform with full Observability (Jaeger, Prometheus, Grafana)
    cmds:
      - "{{.COMPOSE_CMD}} -f docker-compose.yml -f docker-compose.observability.yml up -d"
      - echo "  🚀 Observability stack started."
      - echo "  📊 Grafana    → http://localhost:3000 (admin/admin)"
      - echo "  🔍 Jaeger     → http://localhost:16686"
      - echo "  📈 Prometheus → http://localhost:9090"
      - echo "  🌐 Gateway    → http://localhost:8080"

  compose:obs:down:
    desc: Stop the platform and observability stack
    cmds:
      - "{{.COMPOSE_CMD}} -f docker-compose.yml -f docker-compose.observability.yml down"

  # ─────────────────────────────────────────────
  # Kubernetes
  # ─────────────────────────────────────────────
  k8s:up:
    desc: "Alias for k8s:deploy (complete end-to-end Kubernetes deployment from scratch)"
    cmds:
      - task: k8s:deploy

  k8s:deploy:
    desc: Complete end-to-end deployment from scratch (build, load to Kind, apply, wait, smoke-test, and report)
    cmds:
      - |
        echo "================================================================="
        echo "🚀 STARTING COMPLETE END-TO-END KUBERNETES DEPLOYMENT"
        echo "================================================================="
      - task: k8s:context
      - task: podman:build
      - task: k8s:kind:load
      - task: k8s:apply
      - task: k8s:restart
      - |
        echo "⏳ Waiting for microservice deployments to become Ready..."
        kubectl -n rideshare rollout status deployment/api-gateway --timeout=60s
        kubectl -n rideshare rollout status deployment/ride-service --timeout=60s
        kubectl -n rideshare rollout status deployment/location-service --timeout=60s
        echo "  ✅ Core deployments are Ready!"
      - task: k8s:smoke-test
      - task: k8s:status
      - |
        PORT=$(podman port {{.KIND_CLUSTER}}-control-plane 80/tcp 2>/dev/null | cut -d: -f2 | head -n1)
        PORT=${PORT:-9093}
        echo ""
        echo "================================================================="
        echo "🎉 RIDESHARE PLATFORM FULLY DEPLOYED & VERIFIED IN KUBERNETES!"
        echo "================================================================="
        echo "  🌐 Web Application:          http://localhost:${PORT}"
        echo "  🎛️  Operations Command Center: http://localhost:${PORT}/ops"
        echo "  📈 Prometheus Observability:  task k8s:forward:obs  (http://localhost:9090)"
        echo "  🔍 Jaeger Distributed Traces: task k8s:forward:obs  (http://localhost:16686)"
        echo "  🚗 Run Traffic Simulator:     task simulate"
        echo "================================================================="
        echo ""

  k8s:apply:
    desc: Deploy all resources to Kubernetes via Kustomize
    cmds:
      - kubectl apply -k {{.ROOT_DIR}}/deploy/k8s
      - echo "  ☸️  Kubernetes manifests applied to namespace 'rideshare'"

  k8s:delete:
    desc: Delete all resources from Kubernetes via Kustomize
    cmds:
      - kubectl delete -k {{.ROOT_DIR}}/deploy/k8s
      - echo "  🗑️   Kubernetes manifests deleted"

  k8s:restart:
    desc: Restart all microservice deployments in Kubernetes
    cmds:
      - kubectl -n rideshare rollout restart deployment
      - echo "  ♻️  All deployments restarted in namespace 'rideshare'"

  k8s:status:
    desc: Show status of pods, services, ingress, pvc, jobs, cronjobs in namespace 'rideshare'
    cmds:
      - kubectl -n rideshare get pods,svc,ingress,pvc,job,cronjob

  k8s:smoke-test:
    desc: Run the automated Kubernetes post-deployment verification Job and view logs
    cmds:
      - kubectl -n rideshare delete job rideshare-smoke-test --ignore-not-found
      - kubectl apply -f {{.ROOT_DIR}}/deploy/k8s/job-smoke-test.yaml
      - kubectl -n rideshare wait --for=condition=complete --timeout=60s job/rideshare-smoke-test
      - kubectl -n rideshare logs job/rideshare-smoke-test

  k8s:cron:trigger:
    desc: Manually trigger an immediate run of the maintenance CronJob
    cmds:
      - kubectl -n rideshare create job --from=cronjob/rideshare-maintenance rideshare-manual-$(date +%s)
      - echo "  ⏱️  Triggered manual run of rideshare-maintenance CronJob"

  k8s:logs:
    desc: "Tail Kubernetes logs for a specific service (e.g. task k8s:logs -- api-gateway)"
    cmds:
      - kubectl -n rideshare logs -f -l app.kubernetes.io/name={{.CLI_ARGS}} --tail=100

  k8s:context:
    desc: Set active kubectl context namespace to 'rideshare' for Podman Desktop
    cmds:
      - kubectl config set-context --current --namespace=rideshare
      - echo "  ☸️  Current kubectl context namespace set to 'rideshare'"

  k8s:forward:obs:
    desc: Port-forward Jaeger (16686) and Prometheus (9090) to localhost
    cmds:
      - 'echo "  📈 Prometheus -> http://localhost:9090"'
      - 'echo "  🔍 Jaeger UI  -> http://localhost:16686"'
      - kubectl -n rideshare port-forward svc/prometheus 9090:9090 & kubectl -n rideshare port-forward svc/jaeger 16686:16686

  k8s:chaos:
    desc: Terminate a random microservice pod to demonstrate Kubernetes self-healing
    cmds:
      - |
        POD=$(kubectl -n rideshare get pods -l 'app.kubernetes.io/name in (api-gateway,ride-service,driver-service)' -o jsonpath='{.items[0].metadata.name}')
        echo "  💥 Terminating pod: $POD"
        kubectl -n rideshare delete pod "$POD" --now
        sleep 2
        kubectl -n rideshare get pods

  # ─────────────────────────────────────────────
  # GitOps with Argo CD
  # ─────────────────────────────────────────────
  gitops:install:
    desc: Install Argo CD control plane into namespace 'argocd'
    cmds:
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      - 'echo "  🐙 Argo CD manifests applied to namespace \"argocd\""'

  gitops:apply:
    desc: Register AppProject and Application in Argo CD for declarative GitOps synchronization
    cmds:
      - kubectl apply -f {{.ROOT_DIR}}/deploy/gitops/argocd/project.yaml
      - kubectl apply -f {{.ROOT_DIR}}/deploy/gitops/argocd/application.yaml
      - 'echo "  🐙 Argo CD AppProject & Application registered"'

  gitops:status:
    desc: Check Argo CD synchronization and health status
    cmds:
      - kubectl -n argocd get applications,appprojects 2>/dev/null || echo "Argo CD CRDs not installed yet (run task gitops:install)"
      - kubectl -n argocd get pods

  gitops:ui:
    desc: Retrieve initial Argo CD admin password and start Web UI port-forward (https://localhost:8081)
    cmds:
      - |
        PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" 2>/dev/null | base64 -d || echo "admin")
        echo ""
        echo "  🐙 Argo CD Dashboard: https://localhost:8081"
        echo "  👤 Username:          admin"
        echo "  🔑 Password:          $PASSWORD"
        echo ""
      - kubectl -n argocd port-forward svc/argocd-server 8081:443

  gitops:drift:demo:
    desc: Simulate configuration drift to demonstrate Argo CD automated self-healing
    cmds:
      - |
        echo "  🚨 Injecting manual drift: scaling ride-service deployment to 0 replicas..."
        kubectl -n rideshare scale deployment ride-service --replicas=0
        sleep 2
        kubectl -n rideshare get deployment ride-service
        echo "  ⏳ Watching Argo CD detect drift and auto-heal back to Git state..."
        sleep 5
        kubectl -n rideshare get deployment ride-service

  # ─────────────────────────────────────────────
  # Podman & Podman Desktop Kubernetes Integration
  # ─────────────────────────────────────────────
  podman:build:
    desc: Build all 7 microservices images using Podman
    cmds:
      - task: docker:build

  podman:play:
    desc: Run the full Kubernetes stack in Podman Desktop via 'podman play kube'
    cmds:
      - podman play kube {{.ROOT_DIR}}/deploy/k8s/rideshare-stack.yaml
      - echo "  🚀 Stack running in Podman Desktop! Check the Pods tab in Podman Desktop UI."
      - echo "  🌐 Web Gateway → http://localhost:8080"

  podman:down:
    desc: Stop and clean up the Podman play kube stack
    cmds:
      - podman play kube --down {{.ROOT_DIR}}/deploy/k8s/rideshare-stack.yaml
      - echo "  🛑 Podman stack stopped and cleaned up"

  podman:status:
    desc: List all active Podman pods and containers
    cmds:
      - podman pod ps

  k8s:kind:load:
    desc: Load all local microservice images into a Podman Desktop Kind cluster
    cmds:
      - for:
          - user-service
          - driver-service
          - location-service
          - ride-service
          - payment-service
          - notification-service
          - api-gateway
        cmd: |
          podman tag rideshare/{{.ITEM}}:latest docker.io/rideshare/{{.ITEM}}:latest 2>/dev/null || true
          if echo "{{.CONTAINER_TOOL}}" | grep -q podman; then
            podman image save docker.io/rideshare/{{.ITEM}}:latest | kind load image-archive /dev/stdin --name {{.KIND_CLUSTER}}
          else
            kind load docker-image docker.io/rideshare/{{.ITEM}}:latest --name {{.KIND_CLUSTER}} || kind load docker-image rideshare/{{.ITEM}}:latest --name {{.KIND_CLUSTER}}
          fi
      - |
        if ! podman exec {{.KIND_CLUSTER}}-control-plane crictl images 2>/dev/null | grep -q "docker.io/library/alpine"; then
          podman image save docker.io/library/alpine:latest 2>/dev/null | kind load image-archive /dev/stdin --name {{.KIND_CLUSTER}} || true
        fi
      - echo "  📦 All 7 microservices + base images loaded into Kind cluster '{{.KIND_CLUSTER}}'!"

  # ─────────────────────────────────────────────
  # Autonomous Traffic Simulator
  # ─────────────────────────────────────────────
  simulate:
    desc: Run the autonomous fleet and rider traffic simulation generator
    cmds:
      - cd {{.ROOT_DIR}}/services/simulator && go run ./cmd/simulator -drivers 20 -interval 3

  # ─────────────────────────────────────────────
  # WebAssembly Fare Engine
  # ─────────────────────────────────────────────
  wasm:build:
    desc: "Compile the WASM fare-engine from Go source (WASI target, CGO-free)"
    cmds:
      - |
        cd {{.ROOT_DIR}}/wasm/fare-engine
        GOWORK=off GOOS=wasip1 GOARCH=wasm go build -o fare-engine.wasm .
        echo "  🧩 fare-engine.wasm built ($(du -sh {{.ROOT_DIR}}/wasm/fare-engine/fare-engine.wasm | cut -f1))"

  wasm:test:
    desc: "Test WASM fare-engine with wasmtime (3 pricing scenarios)"
    deps: [wasm:build]
    cmds:
      - |
        WASMTIME=$(which wasmtime 2>/dev/null || echo "$HOME/.wasmtime/bin/wasmtime")
        WASM={{.ROOT_DIR}}/wasm/fare-engine/fare-engine.wasm
        echo "── 1. Solo 10 km, surge 1.0x ──────────────────────────"
        echo '{"distance_meters":10000,"riders":1,"surge":1.0,"ride_type":"SOLO"}' | $WASMTIME $WASM
        echo "── 2. Pool 10 km, 2 riders, surge 1.8x ─────────────────"
        echo '{"distance_meters":10000,"riders":2,"surge":1.8,"ride_type":"POOL"}' | $WASMTIME $WASM
        echo "── 3. Solo 5 km, surge 2.5x (cap) ──────────────────────"
        echo '{"distance_meters":5000,"riders":1,"surge":2.5,"ride_type":"SOLO"}' | $WASMTIME $WASM

  wasm:reload:
    desc: "Hot-reload WASM fare-engine into the ride-service ConfigMap (zero restart)"
    cmds:
      - task: wasm:build
      - |
        kubectl -n rideshare create configmap fare-engine-wasm \
          --from-file=fare-engine.wasm={{.ROOT_DIR}}/wasm/fare-engine/fare-engine.wasm \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "  🔄 fare-engine.wasm hot-reloaded → ride-service picks it up within 30 s"
