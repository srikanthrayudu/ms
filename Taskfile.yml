version: '3'

vars:
  GOPATH:
    sh: go env GOPATH
  BINDIR: "{{.ROOT_DIR}}/bin"
  LOGDIR: /tmp/ms
  CONTAINER_TOOL:
    sh: which docker 2>/dev/null || which podman 2>/dev/null || echo docker
  COMPOSE_CMD:
    sh: |
      if which docker-compose >/dev/null 2>&1; then echo "docker-compose";
      elif docker compose version >/dev/null 2>&1; then echo "docker compose";
      elif which podman-compose >/dev/null 2>&1; then echo "podman-compose";
      elif podman compose version >/dev/null 2>&1; then echo "podman compose";
      else echo "docker compose"; fi

tasks:

  # ─────────────────────────────────────────────
  # Default
  # ─────────────────────────────────────────────
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ─────────────────────────────────────────────
  # Proto
  # ─────────────────────────────────────────────
  proto:generate:
    desc: Regenerate Go gRPC code from protobuf definitions
    dir: "{{.ROOT_DIR}}/proto"
    cmds:
      - "{{.GOPATH}}/bin/buf generate"

  proto:lint:
    desc: Lint protobuf definitions with buf
    dir: "{{.ROOT_DIR}}/proto"
    cmds:
      - "{{.GOPATH}}/bin/buf lint"

  # ─────────────────────────────────────────────
  # Dependencies / Workspace
  # ─────────────────────────────────────────────
  tidy:
    desc: go work sync + go mod tidy for every module
    cmds:
      - go work sync
      - for:
          - proto
          - shared
          - services/user-service
          - services/driver-service
          - services/location-service
          - services/ride-service
          - services/payment-service
          - services/notification-service
          - services/api-gateway
          - services/simulator
        cmd: cd {{.ROOT_DIR}}/{{.ITEM}} && go mod tidy

  # ─────────────────────────────────────────────
  # Build
  # ─────────────────────────────────────────────
  build:
    desc: Build all service binaries into ./bin
    cmds:
      - mkdir -p "{{.BINDIR}}"
      - cd "{{.ROOT_DIR}}/services/user-service"         && go build -o "{{.BINDIR}}/user-service"         ./cmd/user-service
      - cd "{{.ROOT_DIR}}/services/driver-service"       && go build -o "{{.BINDIR}}/driver-service"       ./cmd/driver-service
      - cd "{{.ROOT_DIR}}/services/location-service"     && go build -o "{{.BINDIR}}/location-service"     ./cmd/location-service
      - cd "{{.ROOT_DIR}}/services/ride-service"         && go build -o "{{.BINDIR}}/ride-service"         ./cmd/ride-service
      - cd "{{.ROOT_DIR}}/services/payment-service"      && go build -o "{{.BINDIR}}/payment-service"      ./cmd/payment-service
      - cd "{{.ROOT_DIR}}/services/notification-service" && go build -o "{{.BINDIR}}/notification-service" ./cmd/notification-service
      - cd "{{.ROOT_DIR}}/services/api-gateway"          && go build -o "{{.BINDIR}}/api-gateway"          ./cmd/api-gateway

  build:service:
    desc: "Build a single service  (e.g. task build:service -- ride-service)"
    cmds:
      - cd "{{.ROOT_DIR}}/services/{{.CLI_ARGS}}" && go build -o "{{.BINDIR}}/{{.CLI_ARGS}}" ./cmd/{{.CLI_ARGS}}

  # ─────────────────────────────────────────────/
  # Run / Stop  (each service started via shell & so no background: property is needed)
  # ─────────────────────────────────────────────
  nats:
    desc: Run NATS server in the foreground (useful standalone)
    cmds:
      - "{{.GOPATH}}/bin/nats-server -p 4222 -m 8222"

  up:
    desc: Build everything then start NATS + all services in the background
    deps: [build]
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/data" "{{.LOGDIR}}"
      - |
        # Kill any stale instances first (ignore errors)
        pkill -f "{{.BINDIR}}/" 2>/dev/null || true
        pkill -f "nats-server -p 4222" 2>/dev/null || true
        sleep 0.5

        # Start NATS
        {{.GOPATH}}/bin/nats-server -p 4222 -m 8222 >"{{.LOGDIR}}/nats.log" 2>&1 &
        sleep 1

        # Start backend services (LOG_LEVEL=debug allows the default JWT_SECRET in dev)
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/user-service         >"{{.LOGDIR}}/user.log"         2>&1 &
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/driver-service       >"{{.LOGDIR}}/driver.log"       2>&1 &
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/location-service     >"{{.LOGDIR}}/location.log"     2>&1 &
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/ride-service         >"{{.LOGDIR}}/ride.log"         2>&1 &
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/payment-service      >"{{.LOGDIR}}/payment.log"      2>&1 &
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/notification-service >"{{.LOGDIR}}/notification.log" 2>&1 &
        sleep 1

        # Start gateway last (depends on all others)
        cd "{{.ROOT_DIR}}" && LOG_LEVEL=debug ./bin/api-gateway >"{{.LOGDIR}}/gateway.log" 2>&1 &
        sleep 1

        echo ""
        echo "  ✅  All services started"
        echo "  🌐  Gateway  → http://localhost:8080"
        echo "  📊  NATS mon → http://localhost:8222"
        echo "  📄  Logs     → {{.LOGDIR}}/*.log"
        echo ""

  down:
    desc: Stop all services and NATS
    cmds:
      - |
        for svc in api-gateway notification-service payment-service ride-service location-service driver-service user-service; do
          pkill -f "bin/$svc" 2>/dev/null && echo "  stopped $svc" || true
        done
        pkill -f "nats-server -p 4222" 2>/dev/null && echo "  stopped nats-server" || true
        echo "  ✅  All services stopped"

  restart:
    desc: "Restart a single service (e.g. task restart -- ride-service)"
    cmds:
      - pkill -f "bin/{{.CLI_ARGS}}" 2>/dev/null || true
      - sleep 0.3
      - cd "{{.ROOT_DIR}}" && ./bin/{{.CLI_ARGS}} >"{{.LOGDIR}}/{{.CLI_ARGS}}.log" 2>&1 &
      - echo "  ♻️  Restarted {{.CLI_ARGS}}"

  # ─────────────────────────────────────────────
  # Logs
  # ─────────────────────────────────────────────
  logs:
    desc: Tail all service logs
    cmds:
      - tail -f "{{.LOGDIR}}/nats.log" "{{.LOGDIR}}/user.log" "{{.LOGDIR}}/driver.log" "{{.LOGDIR}}/location.log" "{{.LOGDIR}}/ride.log" "{{.LOGDIR}}/payment.log" "{{.LOGDIR}}/notification.log" "{{.LOGDIR}}/gateway.log"

  logs:service:
    desc: "Tail a single service log (e.g. task logs:service -- ride)"
    cmds:
      - tail -f "{{.LOGDIR}}/{{.CLI_ARGS}}.log"

  # ─────────────────────────────────────────────
  # Test & Quality
  # ─────────────────────────────────────────────
  test:
    desc: Run all tests across the entire workspace
    cmds:
      - go test ./shared/... ./services/user-service/... ./services/driver-service/... ./services/location-service/... ./services/ride-service/... ./services/payment-service/... ./services/notification-service/... ./services/api-gateway/...

  vet:
    desc: Run go vet across all modules
    cmds:
      - for:
          - shared
          - services/user-service
          - services/driver-service
          - services/location-service
          - services/ride-service
          - services/payment-service
          - services/notification-service
          - services/api-gateway
          - services/simulator
        cmd: cd {{.ROOT_DIR}}/{{.ITEM}} && go vet ./... && echo "  ✅  {{.ITEM}}"

  # ─────────────────────────────────────────────
  # Clean
  # ─────────────────────────────────────────────
  clean:
    desc: Remove build artefacts and local databases
    cmds:
      - rm -rf "{{.BINDIR}}" "{{.ROOT_DIR}}/data"
      - echo "  🗑️   Cleaned bin/ and data/"

  clean:logs:
    desc: Remove all log files from /tmp/ms/
    cmds:
      - rm -f "{{.LOGDIR}}"/*.log
      - echo "  🗑️   Cleaned {{.LOGDIR}}/*.log"

  # ─────────────────────────────────────────────
  # DevOps & Containers
  # ─────────────────────────────────────────────
  docker:build:
    desc: Build all container images using Docker or Podman
    cmds:
      - for:
          - user-service
          - driver-service
          - location-service
          - ride-service
          - payment-service
          - notification-service
          - api-gateway
        cmd: "{{.CONTAINER_TOOL}} build -t rideshare/{{.ITEM}}:latest -f services/{{.ITEM}}/Dockerfile {{.ROOT_DIR}}"

  docker:build:service:
    desc: "Build a single container image (e.g. task docker:build:service -- ride-service)"
    cmds:
      - "{{.CONTAINER_TOOL}} build -t rideshare/{{.CLI_ARGS}}:latest -f services/{{.CLI_ARGS}}/Dockerfile {{.ROOT_DIR}}"

  compose:up:
    desc: Start the entire platform using Docker Compose or Podman Compose
    cmds:
      - "{{.COMPOSE_CMD}} up -d"
      - echo "  🚀 Compose stack started. Gateway at http://localhost:8080"

  compose:down:
    desc: Stop and remove the compose containers
    cmds:
      - "{{.COMPOSE_CMD}} down"
      - echo "  🛑 Compose stack stopped"

  compose:logs:
    desc: Tail compose logs across all services
    cmds:
      - "{{.COMPOSE_CMD}} logs -f"

  compose:obs:up:
    desc: Start the platform with full Observability (Jaeger, Prometheus, Grafana)
    cmds:
      - "{{.COMPOSE_CMD}} -f docker-compose.yml -f docker-compose.observability.yml up -d"
      - echo "  🚀 Observability stack started."
      - echo "  📊 Grafana    → http://localhost:3000 (admin/admin)"
      - echo "  🔍 Jaeger     → http://localhost:16686"
      - echo "  📈 Prometheus → http://localhost:9090"
      - echo "  🌐 Gateway    → http://localhost:8080"

  compose:obs:down:
    desc: Stop the platform and observability stack
    cmds:
      - "{{.COMPOSE_CMD}} -f docker-compose.yml -f docker-compose.observability.yml down"

  # ─────────────────────────────────────────────
  # Kubernetes
  # ─────────────────────────────────────────────
  k8s:apply:
    desc: Deploy all resources to Kubernetes via Kustomize
    cmds:
      - kubectl apply -k {{.ROOT_DIR}}/deploy/k8s
      - echo "  ☸️  Kubernetes manifests applied to namespace 'rideshare'"

  k8s:delete:
    desc: Delete all resources from Kubernetes via Kustomize
    cmds:
      - kubectl delete -k {{.ROOT_DIR}}/deploy/k8s
      - echo "  🗑️   Kubernetes manifests deleted"

  k8s:status:
    desc: Show status of pods, services and ingresses in namespace 'rideshare'
    cmds:
      - kubectl -n rideshare get pods,svc,ingress

  # ─────────────────────────────────────────────
  # Podman & Podman Desktop Kubernetes Integration
  # ─────────────────────────────────────────────
  podman:build:
    desc: Build all 7 microservices images using Podman
    cmds:
      - task: docker:build

  podman:play:
    desc: Run the full Kubernetes stack in Podman Desktop via 'podman play kube'
    cmds:
      - podman play kube {{.ROOT_DIR}}/deploy/k8s/rideshare-stack.yaml
      - echo "  🚀 Stack running in Podman Desktop! Check the Pods tab in Podman Desktop UI."
      - echo "  🌐 Web Gateway → http://localhost:8080"

  podman:down:
    desc: Stop and clean up the Podman play kube stack
    cmds:
      - podman play kube --down {{.ROOT_DIR}}/deploy/k8s/rideshare-stack.yaml
      - echo "  🛑 Podman stack stopped and cleaned up"

  podman:status:
    desc: List all active Podman pods and containers
    cmds:
      - podman pod ps

  k8s:kind:load:
    desc: Load all local microservice images into a Podman Desktop Kind cluster
    cmds:
      - for:
          - user-service
          - driver-service
          - location-service
          - ride-service
          - payment-service
          - notification-service
          - api-gateway
        cmd: kind load docker-image rideshare/{{.ITEM}}:latest || podman image save rideshare/{{.ITEM}}:latest | kind load image-archive /dev/stdin
      - echo "  📦 All 7 microservices loaded into Kind cluster!"

  # ─────────────────────────────────────────────
  # Autonomous Traffic Simulator
  # ─────────────────────────────────────────────
  simulate:
    desc: Run the autonomous fleet and rider traffic simulation generator
    cmds:
      - cd {{.ROOT_DIR}}/services/simulator && go run ./cmd/simulator -drivers 20 -interval 3
