services:
  # Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: rideshare-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - rideshare-net

  # Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: rideshare-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090" # Prometheus UI & API
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - rideshare-net

  # Metrics & Traces Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: rideshare-grafana
    restart: unless-stopped
    ports:
      - "3000:3000" # Grafana UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    networks:
      - rideshare-net

volumes:
  prometheus-data:
  grafana-data:
