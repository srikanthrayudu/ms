name: CI / DevOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Task runner
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Go Work Sync & Mod Verify
        run: |
          go work sync
          task vet

      - name: Run Unit & Store Tests
        run: task test

  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet

  build-images:
    name: Build Container Images
    needs: [lint-and-test, compose-validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - driver-service
          - location-service
          - ride-service
          - payment-service
          - notification-service
          - api-gateway
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: rideshare/${{ matrix.service }}:${{ github.sha }},rideshare/${{ matrix.service }}:latest
          load: true
