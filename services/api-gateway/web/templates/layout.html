{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}Swiftride</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.5/bundles/datastar.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="/">
      <span class="brand-icon">🚗</span>
      Swiftride
    </a>
    <span class="spacer"></span>
    {{if .User}}
      <span class="navuser">{{if .UserName}}<strong>{{.UserName}}</strong> · {{end}}{{roleLabel .User.Role}}</span>
      <a href="/dashboard">Book</a>
      <a href="/payments">Payments</a>
      {{if eq .User.Role "driver"}}<a href="/driver">Drive</a>{{end}}
      <span id="notif-badge" class="notif-badge hidden">0</span>
      <button class="notif-read-btn" data-on:click="@post('/api/notifications/read')" title="Mark all read">✓</button>
      <button class="btn sm ghost" data-on:click="@post('/api/logout')">Sign out</button>
      <div data-init="@get('/api/notifications/stream')"></div>
    {{else}}
      <a href="/login">Sign in</a>
      <a class="btn sm primary" href="/register">Get started</a>
    {{end}}
  </nav>
  <main>
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
