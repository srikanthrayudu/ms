{{define "content"}}
<div>
  <div style="margin-bottom:20px">
    <h2>Your ride</h2>
    <p class="muted mt-4">Live updates will appear below as your driver approaches.</p>
  </div>

  <div id="ride-status" class="status pending">
    <span class="badge pending">Finding your driver…</span>
    <div class="driver">Searching for nearby drivers</div>
  </div>

  <div id="map" class="map" style="margin-bottom:0"></div>

  <div data-init="@get('/api/rides/{{.RideID}}/stream')"></div>
</div>

<script>
(function () {
  var DEF = [{{.DefaultLat}}, {{.DefaultLng}}];
  var map = L.map('map').setView(DEF, 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>'
  }).addTo(map);

  var mPick = null, mDrop = null, mDriver = null;

  var pickupIcon = L.divIcon({ html: '<div style="width:14px;height:14px;border-radius:50%;background:#2ecc8c;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)"></div>', className:'', iconSize:[14,14], iconAnchor:[7,7] });
  var dropIcon   = L.divIcon({ html: '<div style="width:14px;height:14px;border-radius:50%;background:#6c8cff;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)"></div>', className:'', iconSize:[14,14], iconAnchor:[7,7] });
  var carIcon    = L.divIcon({ html: '<div style="font-size:22px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))">🚗</div>', className:'', iconSize:[26,26], iconAnchor:[13,13] });

  window.placePickup = function (lat, lng) {
    var ll = [lat, lng];
    if (mPick) mPick.setLatLng(ll); else mPick = L.marker(ll, { icon: pickupIcon }).addTo(map).bindTooltip('Pickup');
    if (mDrop) map.fitBounds([ll, mDrop.getLatLng()], { padding: [52, 52] });
  };
  window.placeDropoff = function (lat, lng) {
    var ll = [lat, lng];
    if (mDrop) mDrop.setLatLng(ll); else mDrop = L.marker(ll, { icon: dropIcon }).addTo(map).bindTooltip('Destination');
  };
  window.moveDriverMarker = function (lat, lng) {
    var ll = [lat, lng];
    if (mDriver) { mDriver.setLatLng(ll); } else { mDriver = L.marker(ll, { icon: carIcon }).addTo(map).bindTooltip('Your driver'); }
  };
})();
</script>
{{end}}
