{{define "content"}}
<section class="card">
  <h2>Driver dashboard</h2>
  {{if not .Onboarded}}
  <div data-signals="{license:'',plate:'',model:''}">
    <p class="muted">Onboard your vehicle to start receiving ride requests.</p>
    <form data-on-submit="@post('/api/driver/onboard')">
      <label>License number<input data-bind="license" required></label>
      <label>Vehicle plate<input data-bind="plate" required></label>
      <label>Vehicle model<input data-bind="model" required></label>
      <button class="btn primary" type="submit">Onboard</button>
    </form>
    <div id="form-error"></div>
  </div>
  {{else}}
  <div data-signals="{online:false}">
    <div id="driver-status" class="status offline">Offline</div>
    <label class="switch">
      <input type="checkbox" data-bind="online" data-on-change="@post('/api/driver/availability')">
      <span>Go online</span>
    </label>
    <div id="current-ride"></div>
    <div id="map" class="map"></div>
    <p class="muted">Going online simulates your location near the city centre so you can be matched. The marker drives itself toward the pickup, then the dropoff.</p>
    <div data-on-load="@get('/api/driver/stream')"></div>
  </div>
  <script>
  (function () {
    var DEF = [{{.DefaultLat}}, {{.DefaultLng}}];
    var map = L.map('map').setView(DEF, 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    var mDriver = null, mPick = null, mDrop = null;
    var walkTimer = null, cur = null, target = null;

    function carIcon() { return L.divIcon({ html: '🚗', className: 'caricon', iconSize: [30, 30] }); }

    window.setDriverMarker = function (lat, lng) {
      var ll = [lat, lng];
      if (mDriver) { mDriver.setLatLng(ll); } else { mDriver = L.marker(ll, { icon: carIcon() }).addTo(map).bindPopup('You'); }
      map.panTo(ll, { animate: true });
    };

    function postLoc() {
      if (!cur) return;
      fetch('/api/driver/location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lat: cur.lat, lng: cur.lng })
      });
    }

    window.startDrivingLoop = function () {
      if (walkTimer) return;
      if (!cur) cur = { lat: DEF[0], lng: DEF[1] };
      setDriverMarker(cur.lat, cur.lng);
      postLoc();
      walkTimer = setInterval(function () {
        if (target) {
          cur.lat += (target.lat - cur.lat) * 0.25;
          cur.lng += (target.lng - cur.lng) * 0.25;
        }
        setDriverMarker(cur.lat, cur.lng);
        postLoc();
      }, 2000);
    };

    window.stopDrivingLoop = function () {
      if (walkTimer) { clearInterval(walkTimer); walkTimer = null; }
    };

    window.onRideMatched = function (rid, plat, plng, dlat, dlng) {
      if (!mPick) mPick = L.marker([plat, plng]).addTo(map).bindPopup('Pickup'); else mPick.setLatLng([plat, plng]);
      if (!mDrop) mDrop = L.marker([dlat, dlng], { icon: L.divIcon({ html: '🏁', className: 'caricon', iconSize: [28, 28] }) }).addTo(map).bindPopup('Dropoff'); else mDrop.setLatLng([dlat, dlng]);
      target = { lat: plat, lng: plng };
      startDrivingLoop();
    };

    window.onRideStatus = function (s) {
      if (s === 'ONGOING' && mDrop) {
        target = { lat: mDrop.getLatLng().lat, lng: mDrop.getLatLng().lng };
      }
      if (s === 'COMPLETED' || s === 'CANCELLED') {
        stopDrivingLoop();
      }
    };
  })();
  </script>
  {{end}}
</section>
{{end}}
