{{define "content"}}
<div class="auth-wrap">
  <h2>Create your account</h2>
  <p class="sub">Join Swiftride in under a minute.</p>

  <div class="card" data-signals="{email:'',password:'',name:'',phone:'',role:'passenger'}">
    <form data-on-submit="@post('/api/register')">
      <label>
        <span>Full name</span>
        <input data-bind="name" placeholder="Jane Smith" required autocomplete="name">
      </label>
      <label>
        <span>Email address</span>
        <input type="email" data-bind="email" placeholder="you@example.com" required autocomplete="email">
      </label>
      <label>
        <span>Password</span>
        <input type="password" data-bind="password" placeholder="••••••••" required autocomplete="new-password" minlength="6">
      </label>
      <label>
        <span>Phone number <span class="text-xs" style="color:var(--muted)">(optional)</span></span>
        <input type="tel" data-bind="phone" placeholder="+1 555 000 0000" autocomplete="tel">
      </label>
      <label>
        <span>I want to</span>
        <select data-bind="role">
          <option value="passenger">Book rides as a Passenger</option>
          <option value="driver">Earn money as a Driver</option>
        </select>
      </label>
      <div class="form-actions">
        <button class="btn primary w-full" type="submit">Create account</button>
      </div>
    </form>
    <div id="form-error"></div>
  </div>

  <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>
</div>
{{end}}
