{{define "content"}}
<div class="auth-wrap">
  <div class="auth-logo">
    <div class="brand-icon">⚡</div>
  </div>
  <h2 style="letter-spacing:-.03em;">Welcome back</h2>
  <p class="sub">Sign in to your Swiftride account or use a 1-click demo.</p>

  <div class="demo-panel">
    <p class="demo-panel-label">⚡ 1-Click Demo Accounts</p>
    <div class="demo-grid">
      <button type="button" class="demo-btn" onclick="fillDemo('passenger@demo.com','demo1234', this)">
        <span class="demo-role-pill pill-passenger">Passenger Demo</span>
        <span class="demo-email">passenger@demo.com</span>
        <span class="demo-pwd">demo1234 · Tap to fill</span>
      </button>
      <button type="button" class="demo-btn" onclick="fillDemo('driver@demo.com','demo1234', this)">
        <span class="demo-role-pill pill-driver">Driver Demo</span>
        <span class="demo-email">driver@demo.com</span>
        <span class="demo-pwd">demo1234 · Tap to fill</span>
      </button>
    </div>
  </div>

  <div class="auth-divider">or sign in with email</div>

  <div class="card" data-signals="{email:'',password:''}">
    <form data-on:submit="@post('/api/login')">
      <div class="form-group">
        <label>
          <span>Email address</span>
          <input type="email" data-bind="email" placeholder="you@example.com" required autocomplete="email">
        </label>
        <label>
          <span>Password</span>
          <input type="password" data-bind="password" placeholder="••••••••" required autocomplete="current-password">
        </label>
        <div class="form-actions">
          <button class="btn primary w-full" type="submit" style="font-size:15px;box-shadow:var(--glow-p);">
            Sign in →
          </button>
        </div>
      </div>
    </form>
    <div id="form-error"></div>
  </div>

  <p class="auth-footer">Don't have an account? <a href="/register">Create one free</a></p>
</div>

<script>
function fillDemo(email, pw, btn) {
  function setSig(name, val) {
    var el = document.querySelector('[data-bind="' + name + '"]');
    if (!el) return;
    var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
    setter.call(el, val);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
  setSig('email', email);
  setSig('password', pw);

  if (btn) {
    var originalBorder = btn.style.borderColor;
    btn.style.borderColor = 'var(--green)';
    btn.style.boxShadow = '0 0 12px rgba(16,185,129,.3)';
    setTimeout(function() {
      btn.style.borderColor = originalBorder;
      btn.style.boxShadow = '';
    }, 1000);
  }
}

(function ensureDemoAccounts() {
  [
    { email: 'passenger@demo.com', password: 'demo1234', name: 'Demo Passenger', phone: '555-0001', role: 'passenger' },
    { email: 'driver@demo.com',    password: 'demo1234', name: 'Demo Driver',    phone: '555-0002', role: 'driver'    }
  ].forEach(function(a) {
    fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(a)
    }).catch(function() {});
  });
})();
</script>
{{end}}
